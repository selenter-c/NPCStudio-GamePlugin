<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>NPC Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <h1>🎭 Студия NPC</h1>
            <div class="header-buttons">
                <button id="btn-pause" class="btn-icon" title="Пауза игры">⏸</button>
                <button id="btn-close-x" class="close-x" title="Закрыть">×</button>
            </div>
        </header>
        <main class="main-layout">
            <div class="left-panel">
                <div class="search-box">
                    <input type="text" id="npc-search" placeholder="Поиск NPC..." autocomplete="off">
                    <button id="btn-refresh" class="btn-refresh" title="Обновить список">🔄</button>
                </div>
                <div class="npc-list-container">
                    <ul id="npc-list" class="npc-list">
                        <li class="npc-loading">Загрузка списка NPC...</li>
                    </ul>
                </div>
            </div>
            <div class="right-panel" id="preview-panel">
                <div class="preview-placeholder" id="preview-placeholder">
                    <span class="placeholder-icon">👤</span>
                    <span class="placeholder-text">Выберите NPC для предпросмотра</span>
                </div>
                <div class="preview-content" id="preview-content" style="display: none;">
                    <div class="model-container" id="model-container">
                        <div id="nif-viewer-status" class="nif-viewer-status" style="display: none;"></div>
                        
                        <div id="nif-viewer-placeholder" class="nif-viewer-placeholder">
                            <span class="placeholder-icon">🎲</span>
                            <span>3D превью</span>
                        </div>
                        
                        <img id="nif-viewer-image" class="nif-viewer-image" alt="3D модель" style="display: none;" />
                        
                        <div class="controls-hint">
                            <span>ЛКМ: Вращение</span>
                            <span>Колесо: Масштаб</span>
                        </div>
                        
                        <div class="nif-viewer-controls">
                            <button id="nif-camera-reset" type="button" title="Сброс камеры">⟲</button>
                            <button id="nif-zoom-in" type="button" title="Приблизить">+</button>
                            <button id="nif-zoom-out" type="button" title="Отдалить">−</button>
                        </div>
                    </div>
                    <div class="npc-info">
                        <h2 class="npc-preview-name" id="preview-name"></h2>
                        <div class="npc-detail-row">
                            <span class="detail-label">Editor ID:</span>
                            <span class="detail-value" id="preview-editorid"></span>
                        </div>
                        <div class="npc-detail-row">
                            <span class="detail-label">Form ID:</span>
                            <span class="detail-value" id="preview-formid"></span>
                        </div>
                        <div class="npc-detail-row">
                            <span class="detail-label">Раса:</span>
                            <span class="detail-value" id="preview-race"></span>
                        </div>
                        <div class="npc-detail-row">
                            <span class="detail-label">Пол:</span>
                            <span class="detail-value" id="preview-gender"></span>
                        </div>
                        <div class="npc-detail-row">
                            <span class="detail-label">Уровень:</span>
                            <span class="detail-value" id="preview-level"></span>
                        </div>
                    </div>
                    <div class="preview-actions">
                        <button id="btn-spawn-selected" class="btn-spawn">Заспавнить NPC</button>
                    </div>
                </div>
            </div>
        </main>
        <footer class="footer">
            <span class="version">v0.1.0 | Selenter</span>
            <button id="btn-test" class="btn-test">Test</button>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
