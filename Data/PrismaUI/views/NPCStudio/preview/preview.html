<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>NPC Preview</title>
    <link rel="stylesheet" href="preview.css">
</head>
<body>
    <div id="preview-container">
        <div id="canvas-container">
            <canvas id="model-canvas"></canvas>
            <div id="loading-overlay">
                <span class="loading-text">Загрузка модели...</span>
            </div>
            <div id="placeholder-overlay">
                <span class="placeholder-icon">👤</span>
                <span class="placeholder-text">Выберите NPC для предпросмотра</span>
            </div>
        </div>
        <div class="controls-hint">
            <span>ЛКМ: Вращение</span>
            <span>Колесо: Масштаб</span>
            <span>ПКМ: Панорама</span>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="preview.js"></script>
</body>
</html>
